aid: apache-apisix
name: Apache APISIX
description: >-
  Apache APISIX is a dynamic, real-time, high-performance cloud-native API
  gateway built on NGINX and etcd, supporting Lua and multi-language plugins
  for traffic management, authentication, observability, and security.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Apache
  - API Gateway
  - Cloud Native
  - Kubernetes
  - Open Source
url: >-
  https://raw.githubusercontent.com/api-evangelist/apache-apisix/refs/heads/main/apis.yml
created: '2026-03-18'
modified: '2026-03-18'
specificationVersion: '0.19'
apis:
  - aid: apache-apisix:apache-apisix
    name: Apache APISIX
    description: >-
      Apache APISIX provides rich traffic management features including load
      balancing, dynamic upstream, canary release, circuit breaking,
      authentication, observability, and more.
    humanURL: https://apisix.apache.org/
    tags:
      - Apache
      - API Gateway
      - Cloud Native
    properties:
      - type: Documentation
        url: https://apisix.apache.org/docs/apisix/getting-started/
      - type: Getting Started
        url: https://apisix.apache.org/docs/apisix/getting-started/README/
      - type: GitHubRepository
        url: https://github.com/apache/apisix
      - type: Change Log
        url: https://github.com/apache/apisix/releases
  - aid: apache-apisix:apache-apisix-admin-api
    name: Apache APISIX Admin API
    description: >-
      The Apache APISIX Admin API provides a RESTful interface to dynamically
      control and configure a running APISIX instance. It supports management
      of routes, services, upstreams, consumers, SSL certificates, global rules,
      plugin configurations, consumer groups, and secrets, and listens by
      default on port 9180 with API key authentication.
    humanURL: https://apisix.apache.org/docs/apisix/admin-api/
    tags:
      - Admin
      - Configuration
      - Management
      - REST
    properties:
      - type: Documentation
        url: https://apisix.apache.org/docs/apisix/admin-api/
      - type: OpenAPI
        url: openapi/apache-apisix-admin-api-openapi.yml
      - type: Authentication
        url: https://apisix.apache.org/docs/apisix/admin-api/#using-the-admin-api
  - aid: apache-apisix:apache-apisix-control-api
    name: Apache APISIX Control API
    description: >-
      The Apache APISIX Control API provides internal status and health check
      endpoints for monitoring and introspecting a running APISIX instance.
      It listens by default on port 9090, is accessible only from localhost,
      and exposes endpoints for health checking, schema retrieval, and runtime
      diagnostics.
    humanURL: https://apisix.apache.org/docs/apisix/control-api/
    tags:
      - Control
      - Health Check
      - Monitoring
      - Observability
    properties:
      - type: Documentation
        url: https://apisix.apache.org/docs/apisix/control-api/
      - type: OpenAPI
        url: openapi/apache-apisix-control-api-openapi.yml
