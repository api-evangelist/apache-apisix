aid: apache-apisix
name: Apache APISIX
description: >-
  Apache APISIX is a dynamic, real-time, high-performance cloud-native API gateway built on NGINX and etcd, developed by
  the Apache Software Foundation. It supports Lua and multi-language plugins for traffic management, authentication,
  observability, and security. APISIX provides a RESTful Admin API for dynamic configuration of routes, upstreams,
  services, consumers, SSL certificates, and plugins, and a Control API for health monitoring and schema introspection.
