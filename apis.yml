aid: apache-apisix
name: Apache APISIX
description: >-
  Apache APISIX is a dynamic, real-time, high-performance cloud-native API
  gateway built on NGINX and etcd, supporting Lua and multi-language plugins
  for traffic management, authentication, observability, and security.
