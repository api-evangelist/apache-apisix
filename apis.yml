apis:
  - aid: apache-apisix:admin-api
    name: Apache APISIX Admin API
    tags:
      - Platform
      - Gateways
      - Administration
    humanURL: https://apisix.apache.org/docs/apisix/admin-api/
    properties:
      - url: https://apisix.apache.org/docs/apisix/admin-api/
        type: Documentation
      - url: openapi/apache-apisix-admin-api-openapi.yml
        type: OpenAPI
    description: >-
      The Apache APISIX Admin API provides a RESTful interface to dynamically
      control and configure your deployed Apache APISIX instance. It allows
      management of routes, services, upstreams, consumers, SSL certificates,
      global rules, plugin configurations, consumer groups, secrets, and more.
      By default, the Admin API listens on port 9180 and requires API key
      authentication via the X-API-KEY header.
  - aid: apache-apisix:control-api
    name: Apache APISIX Control API
    tags:
      - Platform
      - Gateways
      - Monitoring
    humanURL: https://apisix.apache.org/docs/apisix/control-api/
    properties:
      - url: https://apisix.apache.org/docs/apisix/control-api/
        type: Documentation
      - url: openapi/apache-apisix-control-api-openapi.yml
        type: OpenAPI
    description: >-
      The Apache APISIX Control API provides internal status and health check
      endpoints for monitoring and introspecting the running APISIX instance.
      By default, the Control API listens on port 9090 and is only accessible
      from localhost. It exposes endpoints for health checking, schema retrieval,
      and runtime diagnostics.
