openapi: 3.2.0
info:
  title: Apache APISIX Control Diagnostics API
  description: The Apache APISIX Control API provides internal status and health check endpoints for monitoring and introspecting the running APISIX instance. By default, the Control API listens on port 9090 and is only accessible from localhost. It exposes endpoints for health checking, schema retrieval, and runtime diagnostics.
  version: 3.14.0
  contact:
    name: Apache APISIX
    url: https://apisix.apache.org
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: http://127.0.0.1:9090
  description: Default local Control API server
tags:
- name: Diagnostics
  description: Runtime diagnostic operations.
paths:
  /v1/gc:
    post:
      operationId: triggerGC
      summary: Apache APISIX Trigger Garbage Collection
      description: Triggers a full garbage collection cycle in the Lua VM.
      tags:
      - Diagnostics
      responses:
        '200':
          description: GC triggered successfully.
