      tags:
        - Plugin Metadata
      parameters:
        - $ref: '#/components/parameters/PluginName'
      responses:
        '200':
          description: Plugin metadata deleted successfully.
        '404':
          description: Plugin metadata not found.
  /plugins:
    get:
      operationId: listPlugins
      summary: Apache APISIX List all plugins
      description: Fetches a list of all available plugins on the APISIX instance.
      tags:
        - Plugins
      parameters:
        - name: subsystem
          in: query
          description: Filter plugins by subsystem (http or stream).
          schema:
            type: string
            enum:
              - http
              - stream
      responses:
        '200':
          description: Successful response with list of plugin names.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /plugins/{plugin_name}:
    get:
      operationId: getPluginSchema
      summary: Apache APISIX Get plugin schema
      description: Fetches the JSON Schema of the specified plugin.
      tags:
        - Plugins
      parameters:
        - $ref: '#/components/parameters/PluginName'
      responses:
        '200':
          description: Successful response with plugin JSON Schema.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Plugin not found.
  /protos:
    get:
      operationId: listProtos
      summary: Apache APISIX List all protos
      description: Fetches a list of all configured Protocol Buffer definition resources.
      tags:
        - Protos
      responses:
        '200':
          description: Successful response with list of protos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
  /protos/{proto_id}:
    get:
      operationId: getProto
      summary: Apache APISIX Get a proto
      description: Fetches the specified Protocol Buffer definition by its ID.
      tags:
        - Protos
      parameters:
        - $ref: '#/components/parameters/ProtoId'
      responses:
        '200':
          description: Successful response with proto details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: Proto not found.
    put:
      operationId: createOrUpdateProto
      summary: Apache APISIX Create or update a proto
      description: Creates a proto with the specified ID, or updates it if it already exists.
      tags:
        - Protos
      parameters:
        - $ref: '#/components/parameters/ProtoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Proto'
      responses:
        '200':
          description: Proto updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '201':
          description: Proto created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCreated'
    delete:
      operationId: deleteProto
      summary: Apache APISIX Delete a proto
      description: Removes the specified Protocol Buffer definition.
      tags:
        - Protos
      parameters:
        - $ref: '#/components/parameters/ProtoId'
      responses:
        '200':
          description: Proto deleted successfully.
        '404':
          description: Proto not found.
  /stream_routes:
    get:
      operationId: listStreamRoutes
      summary: Apache APISIX List all stream routes
      description: Fetches a list of all configured stream (Layer 4) routes.
      tags:
        - Stream Routes
      responses:
        '200':
          description: Successful response with list of stream routes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
  /stream_routes/{route_id}:
    get:
      operationId: getStreamRoute
      summary: Apache APISIX Get a stream route
      description: Fetches the specified stream route by its ID.
      tags:
        - Stream Routes
      parameters:
        - $ref: '#/components/parameters/StreamRouteId'
      responses:
        '200':
          description: Successful response with stream route details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: Stream route not found.
    put:
      operationId: createOrUpdateStreamRoute
      summary: Apache APISIX Create or update a stream route
      description: Creates a stream route with the specified ID, or updates it if it already exists.
      tags:
        - Stream Routes
      parameters:
        - $ref: '#/components/parameters/StreamRouteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamRoute'
      responses:
        '200':
          description: Stream route updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '201':
          description: Stream route created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCreated'
    delete:
      operationId: deleteStreamRoute
      summary: Apache APISIX Delete a stream route
      description: Removes the specified stream route.
      tags:
        - Stream Routes
      parameters:
        - $ref: '#/components/parameters/StreamRouteId'
      responses:
        '200':
          description: Stream route deleted successfully.
        '404':
          description: Stream route not found.
  /secrets/{secret_manager}/{secret_id}:
    get:
      operationId: getSecret
      summary: Apache APISIX Get a secret
      description: Fetches the specified secret resource from the given secret manager.
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/SecretManager'
        - $ref: '#/components/parameters/SecretId'
      responses:
        '200':
          description: Successful response with secret details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '404':
          description: Secret not found.
    put:
      operationId: createOrUpdateSecret
      summary: Apache APISIX Create or update a secret
      description: Creates a secret with the specified ID in the given manager, or updates it if it already exists.
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/SecretManager'
        - $ref: '#/components/parameters/SecretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
      responses:
        '200':
          description: Secret updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '201':
          description: Secret created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceCreated'
    patch:
      operationId: patchSecret
      summary: Apache APISIX Patch a secret
      description: Updates partial attributes of the specified secret.
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/SecretManager'
        - $ref: '#/components/parameters/SecretId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Secret'
      responses:
        '200':
          description: Secret patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
    delete:
      operationId: deleteSecret
      summary: Apache APISIX Delete a secret
      description: Removes the specified secret resource.
      tags:
        - Secrets
      parameters:
        - $ref: '#/components/parameters/SecretManager'
        - $ref: '#/components/parameters/SecretId'
      responses:
        '200':
          description: Secret deleted successfully.
        '404':
          description: Secret not found.
  /schema/validate/{resource}:
    post:
      operationId: validateSchema
      summary: Apache APISIX Validate resource schema
      description: Validates the given request body against the schema of the specified resource type.
      tags:
        - Schema
      parameters:
        - name: resource
          in: path
          required: true
          description: The resource type to validate against (e.g. routes, services, upstreams).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The resource configuration to validate.
      responses:
        '200':
          description: Validation successful.
        '400':
          description: Validation failed with error details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_msg:
                    type: string
                    description: Validation error message.
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-KEY
      description: Admin API key for authentication.
  parameters:
    RouteId:
      name: route_id
      in: path
      required: true
      description: Unique identifier of the route.
      schema:
        type: string
    ServiceId:
      name: service_id
      in: path
      required: true
      description: Unique identifier of the service.
      schema:
        type: string
    UpstreamId:
      name: upstream_id
      in: path
      required: true
      description: Unique identifier of the upstream.
      schema:
        type: string
    ConsumerUsername:
      name: username
      in: path
      required: true
      description: Username of the consumer.
      schema:
        type: string
    CredentialId:
      name: credential_id
      in: path
      required: true
      description: Unique identifier of the credential.
      schema:
        type: string
    ConsumerGroupId:
      name: group_id
      in: path
      required: true
      description: Unique identifier of the consumer group.
      schema:
        type: string
    SSLId:
      name: ssl_id
      in: path
      required: true
      description: Unique identifier of the SSL certificate resource.
      schema:
        type: string
    GlobalRuleId:
      name: rule_id
      in: path
      required: true
      description: Unique identifier of the global rule.
      schema:
        type: string
    PluginConfigId:
      name: config_id
      in: path
      required: true
      description: Unique identifier of the plugin config.
      schema:
        type: string
    PluginName:
      name: plugin_name
      in: path
      required: true
      description: Name of the plugin.
      schema:
        type: string
    ProtoId:
      name: proto_id
      in: path
      required: true
      description: Unique identifier of the proto resource.
      schema:
        type: string
    StreamRouteId:
      name: route_id
      in: path
      required: true
      description: Unique identifier of the stream route.
      schema:
        type: string
    SecretManager:
      name: secret_manager
      in: path
      required: true
      description: The secret manager type (e.g. vault, aws).
      schema:
        type: string
    SecretId:
      name: secret_id
      in: path
      required: true
      description: Unique identifier of the secret.
      schema:
        type: string
  schemas:
    Route:
      type: object
      description: >-
        A Route defines rules to match client requests and specifies how to
        handle matched requests, including plugins and upstream configurations.
      properties:
        uri:
          type: string
          description: The request URI path. Supports path prefixes with wildcard.
        uris:
          type: array
          items:
            type: string
          description: A list of URIs for the route to match.
        name:
          type: string
          description: Human-readable name for the route.
        desc:
          type: string
          description: Description of the route.
        host:
          type: string
          description: Host to match for the route.
        hosts:
          type: array
          items:
            type: string
          description: A list of hosts for the route to match.
        methods:
          type: array
          items:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - HEAD
              - OPTIONS
              - CONNECT
              - TRACE
          description: HTTP methods to match.
        remote_addr:
          type: string
          description: Client IP address to match.
        remote_addrs:
          type: array
          items:
            type: string
          description: A list of client IP addresses to match.
        vars:
          type: array
          description: DSL expressions for matching request attributes.
        priority:
          type: integer
          default: 0
          description: Route priority for matching order. Higher value means higher priority.
        plugins:
          type: object
          description: Plugin configuration. Key is the plugin name and value is the plugin config.
        upstream:
          $ref: '#/components/schemas/Upstream'
        upstream_id:
          type: string
          description: ID of an existing upstream to use.
        service_id:
          type: string
          description: ID of an existing service to bind to.
        plugin_config_id:
          type: string
          description: ID of a plugin config to bind to.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
        timeout:
          $ref: '#/components/schemas/Timeout'
        enable_websocket:
          type: boolean
          description: Enable WebSocket proxying.
        status:
          type: integer
          enum:
            - 0
            - 1
          default: 1
          description: Route status. 1 for enabled, 0 for disabled.
        filter_func:
          type: string
          description: A Lua function string for custom filtering logic.
    Service:
      type: object
      description: >-
        A Service is an abstraction of an API and corresponds to an upstream
        service. It can be shared across routes.
      properties:
        name:
          type: string
          description: Human-readable name for the service.
        desc:
          type: string
          description: Description of the service.
        plugins:
          type: object
          description: Plugin configuration. Key is the plugin name and value is the plugin config.
        upstream:
          $ref: '#/components/schemas/Upstream'
        upstream_id:
          type: string
          description: ID of an existing upstream to use.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
        enable_websocket:
          type: boolean
          description: Enable WebSocket proxying.
        hosts:
          type: array
          items:
            type: string
          description: A list of hosts for the service.
    Upstream:
      type: object
      description: >-
        An Upstream is a virtual host abstraction that performs load balancing
        on a given set of service nodes according to configured rules.
      properties:
        name:
          type: string
          description: Human-readable name for the upstream.
        desc:
          type: string
          description: Description of the upstream.
        type:
          type: string
          enum:
            - roundrobin
            - chash
            - least_conn
            - ewma
          default: roundrobin
          description: Load balancing algorithm.
        nodes:
          oneOf:
            - type: object
              additionalProperties:
                type: integer
              description: 'Key-value pairs of address:port to weight.'
            - type: array
              items:
                type: object
                properties:
                  host:
                    type: string
                  port:
                    type: integer
                  weight:
                    type: integer
                  priority:
                    type: integer
                    default: 0
              description: List of node objects.
          description: Backend service nodes.
        service_name:
          type: string
          description: Service name for service discovery.
        discovery_type:
          type: string
          description: Type of service discovery (e.g. dns, consul, nacos, eureka).
        hash_on:
          type: string
          enum:
            - vars
            - header
            - cookie
            - consumer
            - vars_combinations
          default: vars
          description: Hash input for consistent hashing load balancer.
        key:
          type: string
          description: Hash key when using chash load balancer.
        checks:
          type: object
          description: Health check configuration.
          properties:
            active:
              type: object
              description: Active health check configuration.
              properties:
                type:
                  type: string
                  enum:
                    - http
                    - https
                    - tcp
                  default: http
                timeout:
                  type: number
                  default: 1
                http_path:
                  type: string
                  default: /
                host:
                  type: string
                port:
                  type: integer
                https_verify_certificate:
                  type: boolean
                  default: true
                healthy:
                  type: object
                  properties:
                    interval:
                      type: integer
                    successes:
                      type: integer
                unhealthy:
                  type: object
                  properties:
                    interval:
                      type: integer
                    http_failures:
                      type: integer
                    tcp_failures:
                      type: integer
                    timeouts:
                      type: integer
            passive:
              type: object
              description: Passive health check configuration.
              properties:
                type:
                  type: string
                  enum:
                    - http
                    - https
                    - tcp
                  default: http
                healthy:
                  type: object
                  properties:
                    http_statuses:
                      type: array
                      items:
                        type: integer
                    successes:
                      type: integer
                unhealthy:
                  type: object
                  properties:
                    http_statuses:
                      type: array
                      items:
                        type: integer
                    http_failures:
                      type: integer
                    tcp_failures:
                      type: integer
                    timeouts:
                      type: integer
        retries:
          type: integer
          description: Number of retries for failed requests.
        retry_timeout:
          type: number
          description: Timeout in seconds for retry requests.
        timeout:
          $ref: '#/components/schemas/Timeout'
        scheme:
          type: string
          enum:
            - http
            - https
            - grpc
            - grpcs
          default: http
          description: The scheme for communicating with the upstream.
        pass_host:
          type: string
          enum:
            - pass
            - node
            - rewrite
          default: pass
          description: How to set the Host header when proxying to upstream.
        upstream_host:
          type: string
          description: Host to use when pass_host is set to rewrite.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
        keepalive_pool:
          type: object
          description: Keepalive pool configuration.
          properties:
            size:
              type: integer
              default: 320
            idle_timeout:
              type: number
              default: 60
            requests:
              type: integer
              default: 1000
        tls:
          type: object
          description: TLS configuration for upstream connections.
          properties:
            client_cert:
              type: string
              description: Client certificate for mTLS.
            client_key:
              type: string
              description: Client private key for mTLS.
    Consumer:
      type: object
      description: A Consumer is an entity that consumes API services and is identified by a username.
      required:
        - username
      properties:
        username:
          type: string
          description: Unique username for the consumer.
        desc:
          type: string
          description: Description of the consumer.
        plugins:
          type: object
          description: Plugin configuration bound to this consumer.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
        group_id:
          type: string
          description: ID of a consumer group this consumer belongs to.
    Credential:
      type: object
      description: A Credential contains authentication plugin configurations bound to a consumer.
      properties:
        desc:
          type: string
          description: Description of the credential.
        plugins:
          type: object
          description: Authentication plugin configuration.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
    ConsumerGroup:
      type: object
      description: >-
        A Consumer Group is a set of plugins that can be applied to multiple
        consumers rather than configuring each consumer individually.
      properties:
        desc:
          type: string
          description: Description of the consumer group.
        plugins:
          type: object
          description: Plugin configuration shared among consumers in this group.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
    SSL:
      type: object
      description: An SSL resource stores SSL certificates and keys for HTTPS traffic.
      required:
        - cert
        - key
        - snis
      properties:
        cert:
          type: string
          description: PEM-encoded SSL certificate.
        key:
          type: string
          description: PEM-encoded private key.
        certs:
          type: array
          items:
            type: string
          description: Additional PEM-encoded certificates for multiple certificates.
        keys:
          type: array
          items:
            type: string
          description: Additional PEM-encoded private keys.
        snis:
          type: array
          items:
            type: string
          description: Server Name Indication values to match.
        client:
          type: object
          description: mTLS client verification configuration.
          properties:
            ca:
              type: string
              description: PEM-encoded CA certificate for client verification.
            depth:
              type: integer
              default: 1
              description: Maximum length of the client certificate chain.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
        status:
          type: integer
          enum:
            - 0
            - 1
          default: 1
          description: SSL status. 1 for enabled, 0 for disabled.
        type:
          type: string
          enum:
            - server
            - client
          default: server
          description: Identifies the type of certificate.
    GlobalRule:
      type: object
      description: >-
        A Global Rule applies plugin configurations to all requests processed
        by the APISIX instance.
      properties:
        plugins:
          type: object
          description: Plugin configuration to apply globally.
    PluginConfig:
      type: object
      description: >-
        A Plugin Config is a reusable set of plugin configurations that can
        be bound to routes.
      properties:
        desc:
          type: string
          description: Description of the plugin config.
        plugins:
          type: object
          description: Plugin configuration.
        labels:
          type: object
          additionalProperties:
            type: string
          description: Key-value pairs for categorization.
    Proto:
      type: object
      description: A Proto resource stores Protocol Buffer definitions used by the grpc-transcode plugin.
      required:
        - content
      properties:
        desc:
          type: string
          description: Description of the proto resource.
        content:
          type: string
          description: The Protocol Buffer definition content.
    StreamRoute:
      type: object
      description: A Stream Route is used for Layer 4 (TCP/UDP) traffic proxying.
      properties:
        desc:
          type: string
          description: Description of the stream route.
        remote_addr:
          type: string
          description: Client IP address to match.
        server_addr:
          type: string
          description: Server address to match.
        server_port:
          type: integer
          description: Server port to match.
        sni:
          type: string
          description: Server Name Indication value to match.
        plugins:
          type: object
          description: Plugin configuration for the stream route.
        upstream:
          $ref: '#/components/schemas/Upstream'
        upstream_id:
          type: string
          description: ID of an existing upstream to use.
    Secret:
      type: object
      description: >-
        A Secret resource manages integration with external secret managers
        such as HashiCorp Vault or AWS Secrets Manager.
      properties:
        uri:
          type: string
          description: URI of the secret manager endpoint.
        prefix:
          type: string
          description: Path prefix in the secret manager.
        token:
          type: string
          description: Authentication token for the secret manager.
    Timeout:
      type: object
      description: Timeout settings for upstream connections.
      properties:
        connect:
          type: number
          default: 60
          description: Connection timeout in seconds.
        send:
          type: number
          default: 60
          description: Send timeout in seconds.
        read:
          type: number
          default: 60
          description: Read timeout in seconds.
    ResourceResponse:
      type: object
      description: Standard response wrapper for a single resource.
      properties:
        key:
          type: string
          description: The etcd key path for the resource.
        value:
          type: object
          description: The resource configuration.
        modifiedIndex:
          type: integer
          description: The etcd modification index.
        createdIndex:
          type: integer
          description: The etcd creation index.
    ResourceCreated:
      type: object
      description: Response wrapper for a newly created resource.
      properties:
        key:
          type: string
          description: The etcd key path for the created resource.
        value:
          type: object
          description: The created resource configuration.
    ResourceList:
      type: object
      description: Standard response wrapper for a list of resources.
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ResourceResponse'
          description: Array of resource entries.
        total:
          type: integer
          description: Total count of resources.
tags:
  - name: Routes
    description: Manage HTTP routes that define rules for matching client requests.
  - name: Services
    description: Manage services as abstractions of upstream APIs.
  - name: Upstreams
    description: Manage upstream backend service definitions with load balancing.
  - name: Consumers
    description: Manage API consumers and their credentials.
  - name: Consumer Groups
    description: Manage consumer groups for shared plugin configurations.
  - name: SSL
    description: Manage SSL/TLS certificate resources.
  - name: Global Rules
    description: Manage global plugin rules applied to all requests.
  - name: Plugin Configs
    description: Manage reusable plugin configuration sets.
  - name: Plugin Metadata
    description: Manage metadata for individual plugins.
  - name: Plugins
    description: Query available plugins and their schemas.
  - name: Protos
    description: Manage Protocol Buffer definition resources.
  - name: Stream Routes
    description: Manage Layer 4 TCP/UDP stream routes.
  - name: Secrets
    description: Manage secrets from external secret managers.
  - name: Schema
    description: Validate resource configurations against APISIX schemas.
