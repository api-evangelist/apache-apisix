naftiko: 1.0.0-alpha2
info:
  label: Apache APISIX Gateway Configuration
  description: Unified capability for configuring and managing Apache APISIX API gateway resources including routes, upstreams,
    services, consumers, and SSL certificates. Used by platform engineers and API gateway administrators.
  tags:
  - Apache APISIX
  - API Gateway
  - Configuration
  - Cloud Native
  - Traffic Management
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    APISIX_ADMIN_KEY: APISIX_ADMIN_KEY
capability:
  consumes:
  - type: http
    namespace: apisix-admin
    baseUri: http://localhost:9180/apisix/admin
    description: Apache APISIX Admin REST API.
    authentication:
      type: apikey
      key: X-API-KEY
      value: '{{APISIX_ADMIN_KEY}}'
      placement: header
    resources:
    - name: routes
      path: /routes
      description: Manage routing rules.
      operations:
      - name: list-routes
        method: GET
        description: List all routes.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-route
        method: POST
        description: Create a new route.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-route
        method: GET
        description: Get a route by ID.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-route
        method: PUT
        description: Update a route.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-route
        method: DELETE
        description: Delete a route.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: upstreams
      path: /upstreams
      description: Manage upstream backend services.
      operations:
      - name: list-upstreams
        method: GET
        description: List all upstreams.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-upstream
        method: POST
        description: Create a new upstream.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services
      path: /services
      description: Manage service abstractions.
      operations:
      - name: list-services
        method: GET
        description: List all services.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-service
        method: POST
        description: Create a new service.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: consumers
      path: /consumers
      description: Manage API consumers.
      operations:
      - name: list-consumers
        method: GET
        description: List all consumers.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-consumer
        method: POST
        description: Create a new consumer.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ssls
      path: /ssls
      description: Manage SSL certificates.
      operations:
      - name: list-ssls
        method: GET
        description: List all SSL certificates.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: apisix-gateway-api
    description: Unified REST API for APISIX gateway configuration.
    resources:
    - path: /v1/routes
      name: routes
      operations:
      - method: GET
        name: list-routes
        description: List all gateway routes.
        call: apisix-admin.list-routes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-route
        description: Create a new gateway route.
        call: apisix-admin.create-route
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/upstreams
      name: upstreams
      operations:
      - method: GET
        name: list-upstreams
        description: List backend upstreams.
        call: apisix-admin.list-upstreams
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-upstream
        description: Create a backend upstream.
        call: apisix-admin.create-upstream
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/consumers
      name: consumers
      operations:
      - method: GET
        name: list-consumers
        description: List API consumers.
        call: apisix-admin.list-consumers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-consumer
        description: Create an API consumer.
        call: apisix-admin.create-consumer
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: apisix-gateway-mcp
    transport: http
    description: MCP server for AI-assisted APISIX gateway configuration.
    tools:
    - name: list-routes
      description: List all APISIX gateway routes.
      hints:
        readOnly: true
        openWorld: true
      call: apisix-admin.list-routes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-route
      description: Create a new APISIX route for traffic routing.
      hints:
        readOnly: false
        openWorld: false
      call: apisix-admin.create-route
      outputParameters:
      - type: object
        mapping: $.
    - name: update-route
      description: Update an existing APISIX route.
      hints:
        readOnly: false
        idempotent: true
      call: apisix-admin.update-route
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-route
      description: Delete an APISIX route.
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: apisix-admin.delete-route
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: list-upstreams
      description: List all backend upstream configurations.
      hints:
        readOnly: true
        openWorld: true
      call: apisix-admin.list-upstreams
      outputParameters:
      - type: object
        mapping: $.
    - name: create-upstream
      description: Create a new backend upstream with load balancing config.
      hints:
        readOnly: false
        openWorld: false
      call: apisix-admin.create-upstream
      outputParameters:
      - type: object
        mapping: $.
    - name: list-consumers
      description: List all API consumers and their plugin configs.
      hints:
        readOnly: true
        openWorld: true
      call: apisix-admin.list-consumers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-consumer
      description: Create a new API consumer with authentication plugins.
      hints:
        readOnly: false
        openWorld: false
      call: apisix-admin.create-consumer
      outputParameters:
      - type: object
        mapping: $.
