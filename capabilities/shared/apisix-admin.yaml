naftiko: 1.0.0-alpha1
info:
  label: Apache APISIX Admin API
  description: Shared per-API capability definition for the Apache APISIX Admin 
    API, covering route, service, upstream, consumer, SSL, plugin, and consumer 
    group management.
  tags:
  - Apache APISIX
  - API Gateway
  - Admin
  - Configuration
  - Cloud Native
  created: '2026-04-19'
  modified: '2026-04-19'
binds:
- namespace: env
  keys:
    APISIX_ADMIN_KEY: APISIX_ADMIN_KEY
capability:
  consumes:
  - type: http
    namespace: apisix-admin
    baseUri: http://localhost:9180/apisix/admin
    description: Apache APISIX Admin REST API.
    authentication:
      type: apikey
      key: X-API-KEY
      value: '{{APISIX_ADMIN_KEY}}'
      placement: header
    resources:
    - name: routes
      path: /routes
      description: Manage routing rules.
      operations:
      - name: list-routes
        method: GET
        description: List all routes.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-route
        method: POST
        description: Create a new route.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-route
        method: GET
        description: Get a route by ID.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-route
        method: PUT
        description: Update a route.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-route
        method: DELETE
        description: Delete a route.
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: upstreams
      path: /upstreams
      description: Manage upstream backend services.
      operations:
      - name: list-upstreams
        method: GET
        description: List all upstreams.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-upstream
        method: POST
        description: Create a new upstream.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: services
      path: /services
      description: Manage service abstractions.
      operations:
      - name: list-services
        method: GET
        description: List all services.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-service
        method: POST
        description: Create a new service.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: consumers
      path: /consumers
      description: Manage API consumers.
      operations:
      - name: list-consumers
        method: GET
        description: List all consumers.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-consumer
        method: POST
        description: Create a new consumer.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: ssls
      path: /ssls
      description: Manage SSL certificates.
      operations:
      - name: list-ssls
        method: GET
        description: List all SSL certificates.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8100
    namespace: apisix-admin-api
    resources:
    - path: /v1/routes
      name: routes
      operations:
      - method: GET
        name: list-routes
        description: List routes.
        call: apisix-admin.list-routes
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-route
        description: Create route.
        call: apisix-admin.create-route
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9100
    namespace: apisix-admin-mcp
    transport: http
    tools:
    - name: list-routes
      description: List all APISIX routes.
      hints:
        readOnly: true
        openWorld: true
      call: apisix-admin.list-routes
      outputParameters:
      - type: object
        mapping: $.
    - name: create-route
      description: Create a new APISIX route.
      hints:
        readOnly: false
        openWorld: false
      call: apisix-admin.create-route
      outputParameters:
      - type: object
        mapping: $.
    - name: list-upstreams
      description: List all APISIX upstreams.
      hints:
        readOnly: true
        openWorld: true
      call: apisix-admin.list-upstreams
      outputParameters:
      - type: object
        mapping: $.
    - name: list-consumers
      description: List all APISIX consumers.
      hints:
        readOnly: true
        openWorld: true
      call: apisix-admin.list-consumers
      outputParameters:
      - type: object
        mapping: $.
